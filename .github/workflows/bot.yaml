name: Kemet bot
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: kemet-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    # Public repo: runs all the time (free). Private repo: only once an hour (saves free minutes).
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Make sure ffmpeg exists
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          RUN_SECONDS: ${{ github.event.repository.visibility == 'public' && '270' || '0' }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "kemet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_bot.json || true
          git diff --staged --quiet || (git commit -q -m "bot state" && git pull --rebase -q && git push -q)
      - name: Tell me in Telegram if the bot crashed
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # at most about twice an hour, so a long outage cannot spam you
          if [ "$(date -u +%M)" -lt 10 ]; then
            curl -s -m 15 -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
              -d chat_id="${CHAT}" \
              --data-urlencode "text=⚠️ The Kemet bot crashed on GitHub. Open the repo → Actions → Kemet bot and send me a screenshot of the red step." > /dev/null || true
          fi
